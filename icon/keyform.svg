    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c313b"/>
      <stop offset="1" stop-color="#1b1e25"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="221" height="221" rx="54.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
  <!-- keycap shadow -->
  <rect x="62" y="74" width="132" height="128" rx="28" fill="#0a3a30" fill-opacity=".35"/>
  <!-- keycap body -->
  <rect x="60" y="62" width="136" height="132" rx="28" fill="url(#side)"/>
  <!-- keycap top surface -->
  <rect x="76" y="70" width="104" height="96" rx="20" fill="url(#top)"/>
  <rect x="76.75" y="70.75" width="102.5" height="94.5" rx="19.25" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"/>
  <!-- homing bar -->
